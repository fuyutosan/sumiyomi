  const BLEED=[{opacity:0,filter:"blur(6px)"},{opacity:1,filter:"blur(0)"}];
  const bleed=(el,d,dur)=>el&&A(el,BLEED,d,dur||450);
  /* 一字を墨で置く：にじんで少し大きい所から、くっきり落ち着く */
  const ink=(el,d,dur)=>el&&A(el,[{opacity:0,filter:"blur(5px)",transform:"scale(1.12)"},{opacity:1,offset:.45},{opacity:1,filter:"blur(0)",transform:"none"}],d,dur||460);
  /* 託宣の列：やわらかい境目のマスクを上から下へ送る */
  const WIPE=[{opacity:0,filter:"blur(2px)",maskPosition:"0 100%",webkitMaskPosition:"0 100%"},{opacity:1,offset:.15},{opacity:1,filter:"blur(0)",maskPosition:"0 0",webkitMaskPosition:"0 0"}];
  const wipe=(el,d,dur)=>{ if(!el) return; el.classList.add("fl-wipe"); A(el,WIPE,d,dur,{easing:"cubic-bezier(.35,.1,.45,1)"}); };
  /* 墨のにじみ：中心が濃く外へ薄れる不規則な形（庭の墨はねと同じ形）。ふわっと広がって引く */
  let bn=0;
  const blot=(x,y,size,d,dur,alpha,rgb)=>at(d,()=>{
    const sv=document.createElementNS(NS,"svg"), [bx,bt]=pt(x,y), id="flg"+(++bn), c=`rgb(${rgb||"29,26,21"})`;
    sv.setAttribute("viewBox","0 0 128 128"); sv.setAttribute("aria-hidden","true"); sv.classList.add("fl-blot");
    sv.innerHTML=`<defs><radialGradient id="${id}"><stop offset="0" stop-color="${c}" stop-opacity="${alpha}"/><stop offset=".55" stop-color="${c}" stop-opacity="${alpha*.4}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs><path d="${SPLATS[Math.floor(Math.random()*SPLATS.length)]}" fill="url(#${id})" filter="url(#inkrough)"/>`;
    Object.assign(sv.style,{left:bx+"px",top:bt+"px",width:size*u+"px",height:size*u+"px"});
    ov.appendChild(sv); extras.push(sv);
    const a=sv.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:0},{opacity:1,offset:.22},{transform:"translate(-50%,-50%) scale(1)",opacity:0}],{duration:T(dur),easing:"ease-out",fill:"both"});
    anims.push(a); a.onfinish=()=>sv.remove();
  });
  /* 墨の筋：着地した言の葉の墨だまりから題の書き出しへ一本上る。根元を押して太く濃く、すぐ細り、先は墨が尽きて薄い筆の線
     （太さが一定の線だと髪の毛やひっかき傷に、太さの差が小さい線だとペンに、伸びる先が太い棒だとカーソルに見えた。第11回の小会議）。
     伸びているあいだも筆先はいつも細く尖るよう、根元から今の筆先までの先細りの帯を毎コマ描き直す */
  const thread=(x0,y0,x1,y1,d,dur)=>at(d,()=>{
    const [ax,ay]=pt(x0,y0), [bx,bt]=pt(x1,y1), c1=[ax-34*u,ay-(ay-bt)*.35], c2=[bx+26*u,bt+(ay-bt)*.42];
    const P=t=>{ const m=1-t; return [m*m*m*ax+3*m*m*t*c1[0]+3*m*t*t*c2[0]+t*t*t*bx, m*m*m*ay+3*m*m*t*c1[1]+3*m*t*t*c2[1]+t*t*t*bt]; };
    const band=(w0,w1,k,s)=>{ // 太さ w0→w1（札の単位）の帯を根元から s（0〜1）まで。k が大きいほど根元から早く細る
      const L=[], R=[], N=Math.max(4,Math.ceil(40*s));
      for(let i=0;i<=N;i++){
        const t=s*i/N, p=P(t), a=P(Math.max(0,t-.01)), b=P(Math.min(1,t+.01)), dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1,
          tip=Math.min(1,.08+(s-t)/.12), w=(w1+(w0-w1)*Math.pow(1-t,k))*tip*u/2;
        L.push([p[0]-dy/l*w,p[1]+dx/l*w]); R.unshift([p[0]+dy/l*w,p[1]-dx/l*w]);
      }
      return "M"+L.concat(R).map(q=>q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" L")+"Z";
    };
    const sv=document.createElementNS(NS,"svg"), id="flm"+(++bn);
    // にじみをぼかす範囲は曲線全体を囲む固定の枠（線の外形に対する割合だと、伸び始めの小さな線でぼかしが四角く切れる）
    const xs=[ax,c1[0],c2[0],bx], ys=[ay,c1[1],c2[1],bt], m=30*u, fx=Math.min(...xs)-m, fy=Math.min(...ys)-m;
    sv.setAttribute("aria-hidden","true"); sv.classList.add("fl-thread");
    sv.innerHTML=`<defs><linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="${ax}" y1="${ay}" x2="${bx}" y2="${bt}"><stop offset="0" stop-color="#1d1a15" stop-opacity=".82"/><stop offset=".5" stop-color="#1d1a15" stop-opacity=".52"/><stop offset="1" stop-color="#1d1a15" stop-opacity=".26"/></linearGradient>`
      +`<filter id="${id}h" filterUnits="userSpaceOnUse" x="${fx.toFixed(1)}" y="${fy.toFixed(1)}" width="${(Math.max(...xs)+m-fx).toFixed(1)}" height="${(Math.max(...ys)+m-fy).toFixed(1)}"><feGaussianBlur stdDeviation="${(4*u).toFixed(2)}"/></filter></defs>`
      +`<path fill="rgba(29,26,21,.17)" filter="url(#${id}h)"/><path fill="url(#${id}g)"/>`;
    const [halo,core]=sv.querySelectorAll("path");
    ov.appendChild(sv); extras.push(sv);
    const t0=performance.now(), D=Math.max(1,T(dur)), ease=x=>x<.5?4*x*x*x:1-Math.pow(2-2*x,3)/2;
    const grow=now=>{
      if(!sv.isConnected) return; // 飛ばす・閉じるで片づいたら止める
      const s=Math.max(.03,ease(Math.min(1,(now-t0)/D)));
      halo.setAttribute("d",band(28,6,1.3,s)); core.setAttribute("d",band(10,1.1,1.8,s));
      if(s<1) requestAnimationFrame(grow);
    };
    grow(t0);
    anims.push(sv.animate([{opacity:1},{opacity:1,offset:.42},{opacity:0}],{duration:T(dur*2.6),fill:"both"}));
  });
  let stamped=false, revealed=false;
  const stampNow=()=>{ if(stamped) return; stamped=true; Oto.stamp(); ov.classList.remove("fl-light"); };
  /* ボタンを出す（札が元の大きさへ収まり始めるのと同時）。ここからは触っても飛ばさない */
  const reveal=()=>{
    if(revealed) return; revealed=true;
    ov.removeEventListener("click",skip); document.removeEventListener("keydown",skipKey,true);
    ov.classList.remove("writing"); ov.removeAttribute("aria-busy"); hint.remove();
    focusFudaSave();
  };
  const end=()=>{
    if(FL.run!==run) return;
    FL.run=null;
    removeEventListener("resize",end);
    timers.forEach(clearTimeout);
    anims.forEach(a=>{ try{ a.finish(); }catch(e){} });
    extras.forEach(e=>e.remove());
    stampNow(); reveal(); ov.classList.remove("fl-light");
    requestAnimationFrame(()=>layers.remove());
    try{ localStorage.setItem("sumiyomi-fuda","1"); }catch(e){}
  };
  /* 飛ばす：click で受ける（pointerdown だと、指を離した所に現れたボタンが押されてしまう） */
  const skip=()=>{ if(FL.run!==run||revealed) return; trackOnce("fuda-skip"); end(); };
  /* キー：修飾キーだけ・組み合わせ・Tab では飛ばさない。Enter・空白・Esc は裏のボタンに届かないよう止める */
  const skipKey=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||["Tab","Shift","Control","Alt","Meta","CapsLock"].includes(e.key)) return;
    if(e.key==="Enter"||e.key===" "||e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); }
    skip();
  };
  const run={end}; FL.run=run;
  ov.addEventListener("click",skip); document.addEventListener("keydown",skipKey,true);
  addEventListener("resize",end); // 画面を回す・窓の幅を変えると座標が合わなくなるので、すぐ仕上げる

  // 1. 台と紙
  A(ov,[{opacity:0},{opacity:1}],0,300);
  A(wrap,[{opacity:0,transform:`translateY(${zy+14}px) scale(${Z*.985})`},{opacity:1,transform:ZT}],0,480);
  bleed(cv.no,250,450);
  const hint=document.createElement("div"); hint.className="fl-hint"; hint.textContent="触れると、すぐに仕上がります";
  ov.appendChild(hint); extras.push(hint); A(hint,[{opacity:0},{opacity:1}],600,400);
  // 2. 拾った言の葉が、札の中ほどに大きく浮かぶ
  const sx=[FW/2+150,FW/2,FW/2-150];
  const words=F.slots.map((s,i)=>{
    const big=Math.min(110,Math.floor(380/[...s.w].length)), el=document.createElement("div"), [x0,y0]=pt(sx[i],860);
    el.className="fl-word"; el.textContent=s.w; el.setAttribute("aria-hidden","true");
    Object.assign(el.style,{fontSize:big*u+"px",letterSpacing:(4/s.size)+"em",left:x0+"px",top:y0+"px"});
    ov.appendChild(el); extras.push(el); bleed(el,300+i*100,380);
    return {el,s,big,x0,y0};
  });
  // 3. 言の葉が墨になって（縦に伸び、尾を引き、墨の灰へ）、札の下の自分の場所へ流れ込む
  bleed(cv.wHead,1100,450);
  words.forEach((w,i)=>{
    const s=w.s, [x1,y1]=pt(s.x,s.y+s.h/2), dx=x1-w.x0, dy=y1-w.y0, sc=s.size/w.big, m=(1+sc)/2, d=700+i*130, land=d+650;
    A(w.el,[
      {transform:"translate(-50%,-50%)",opacity:1,filter:"blur(0)",color:"#1d1a15",textShadow:"0 0 0 rgba(29,26,21,0)"},
      {transform:`translate(-50%,-50%) translate(${dx*.5+(1-i)*14*u}px,${dy*.45}px) scale(${m*.92},${m*1.16})`,opacity:1,filter:"blur(1.2px)",color:"rgba(29,26,21,.8)",textShadow:`0 ${-12*u}px ${7*u}px rgba(29,26,21,.24)`,offset:.5},
      {opacity:.9,offset:.8}, // 着地の直前まで濃さを残す（3語が宙で同時に薄れて札が空に見えないように）
      {transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(${sc*.9},${sc*1.22})`,opacity:0,filter:"blur(1.8px)",color:"rgba(29,26,21,.6)",textShadow:`0 ${-18*u}px ${10*u}px rgba(29,26,21,0)`}
    ],d,650,{easing:"cubic-bezier(.45,0,.3,1)",fill:"forwards"});
    bleed(cv["w"+i],land-120,360);
    blot(s.x,s.y+s.h*.4,Math.max(110,s.h*1.3),land-60,600,.32);
    at(land,()=>Oto.drip(.06));
  });
  // 4. 着地した言の葉から墨の筋が題へ上り、題が一字ずつ書かれる
  blot(FW/2,F.by+56,46,1440,700,.3); // 筋の根元の墨だまり（出始めが細い縦棒だとカーソルに見えた）
  thread(FW/2,F.by+52,FW/2+110,282,1480,300);
  let t=1780;
  at(t,()=>Oto.plop());
  for(let j=0;j<F.nP;j++) ink(cv["tP"+j],t+j*170);
  for(let j=0;j<F.nNo;j++) ink(cv["tNo"+j],t+F.nP*170-120+j*70,360);
  const tS0=t+F.nP*170+150;
  for(let j=0;j<F.nS;j++) ink(cv["tS"+j],tS0+j*170);
  t=tS0+Math.max(0,F.nS-1)*170+300;
  // 5. 託宣を右の列から
  bleed(cv.oHead,t-200,400);
  const st=Math.min(110,550/Math.max(1,F.cols));
  for(let i=0;i<F.cols;i++) wipe(cv["o"+i],t+i*st,400);
  t+=Math.max(0,F.cols-1)*st+400;
  // 6. 今日の一歩
  bleed(cv.stHead,t-180,400);
  for(let i=0;i<F.steps;i++) A(cv["st"+i],[{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],t-30+i*110,380);
  t+=Math.max(0,F.steps-1)*110+330;
  // 7. 落款を押す（「とん」と朱のにじみ、台が暗くなる）→ 0.3秒おいて札が元の大きさへ収まり、ボタンが現れる
  A(cv.seal,[{opacity:0,transform:"scale(1.7) rotate(-6deg)"},{opacity:1,transform:"scale(.94)",offset:.7},{opacity:1,transform:"none"}],t,420,{easing:"cubic-bezier(.3,1.3,.5,1)"});
  const sealAt=t+290;
  at(sealAt,stampNow);
  blot(FW-100,FH-100,210,sealAt-30,620,.26,"176,58,32");
  A(wrap,[{transform:ZT},{transform:"none"}],sealAt+300,620,{easing:"cubic-bezier(.3,.6,.3,1)"});
  at(sealAt+300,reveal);
  at(sealAt+300+640,end);
}
async function saveFuda(){
  const src=document.getElementById("fuda").src;
  trackOnce("save-fuda");
  /* iPhoneはdownload属性だけだとカメラロールに落ちず長押し保存が必要になるので、
     共有シートを開いて「画像を保存」を選べば一気にカメラロールへ入るこちらを優先する */
  if(navigator.canShare){
    try{
      const blob=await(await fetch(src)).blob();
      const file=new File([blob],"sumiyomi_"+LAST.title+".png",{type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }catch(e){
      if(e&&e.name==="AbortError") return;
    }
  }
  const a=document.createElement("a");
  a.href=src;
  a.download="sumiyomi_"+LAST.title+".png";
  a.click();
}
async function shareFuda(){
  const src=document.getElementById("fuda").src;
  const text=`いまのこころ：『${LAST.title}』\n#墨詠み で、こころの見立てをもらいました\n${APP_URL}`;
  trackOnce("share-ig");
  if(navigator.canShare){
    try{
      const blob=await(await fetch(src)).blob();
      const file=new File([blob],"sumiyomi.png",{type:"image/png"});
      if(navigator.canShare({files:[file]})){
        /* 共有シートを開くとInstagramも選択肢に出る。選ぶとストーリーズ/投稿の選択画面がこの画像入りで開く */
        await navigator.share({files:[file],text});
        return;
      }
    }catch(e){
      /* iOSは共有先アプリ(Instagram等)が完了を報告しないため、実際は共有できていてもshare()がAbortErrorで
         reject することがある。この場合は「共有できなかった」と決めつけて保存を強制しない */
      if(e&&e.name==="AbortError") return;
    }
  }
  alert("この端末では直接シェアできないみたい。札を保存して、Instagramアプリから投稿してね");
  saveFuda();
}
function shareX(){
  const words=LAST.words.map(t=>"「"+t+"」").join("");
  trackOnce("share-x");
  const text=`拾った言の葉：${words}\nいまのこころ：『${LAST.title}』\n\nなんでこんな気分か、自分でもよく分からない日は墨に聞いてみて #墨詠み`;
  window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text)+"&url="+encodeURIComponent(APP_URL),"_blank");
}
function shareLine(){
  const words=LAST.words.map(t=>"「"+t+"」").join("");
  trackOnce("share-line");
  const text=`拾った言の葉：${words}\nいまのこころ：『${LAST.title}』\n\nなんでこんな気分か、自分でもよく分からない日は墨に聞いてみて\n${APP_URL}`;
  window.open("https://line.me/R/msg/text/?"+encodeURIComponent(text),"_blank");
}
function closeFuda(){
  if(FL.run) FL.run.end();
  document.getElementById("overlay").classList.remove("active");
}
function retryGarden(){
  closeFuda();
  startGarden();
}
function shareApp(){
  const text="墨詠み — なんとなくもやもやする日に、半紙に墨が落ちて庭がひらく。言の葉を三つ拾うと、墨があなたのこころを言い当てます。";
  if(navigator.share){ navigator.share({title:"墨詠み",text,url:APP_URL}); }
  else{ navigator.clipboard.writeText(text+"\n"+APP_URL).then(()=>alert("紹介文をコピーしました")); }
}
